name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q lab detection tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic JSONL
        run: python -c "import json; [json.loads(x) for x in open('detection/sample_ai_events.jsonl', encoding='utf-8')] "
      - name: Run sample detectors
        run: |
          python detection/detect_injection.py detection/sample_ai_events.jsonl
          python detection/shadow_ai_scan.py detection/sample_dns.log
